name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Test & E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri & native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/medical-studio/frontend/package-lock.json

      - name: Build MedicalStudio Frontend (Vue 3 + Tailwind)
        working-directory: crates/medical-studio/frontend
        run: |
          npm ci
          npm run build

      - name: Cargo Check & Build Workspace
        run: |
          cargo check --workspace
          cargo build --workspace

      - name: Cargo Test Workspace
        run: cargo test --workspace

      - name: Setup Python for E2E
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Tier 1 E2E Suite against live medical-server
        run: python -m e2e.run_e2e --spawn-server --tier 1
