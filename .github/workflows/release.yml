name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0 or latest)"
        required: true
        default: "latest"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Linux Cloud Server Standalone Release (bare-metal / VM / systemd + Docker Compose kit)
  build-cloud-server:
    name: Cloud Server Release (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build medical-server (release)
        run: cargo build --release --bin medical-server

      - name: Package Cloud Server Deployment Bundle
        run: |
          mkdir -p cloud_pkg
          cp target/release/medical-server cloud_pkg/
          chmod +x cloud_pkg/medical-server
          cp -r migrations config deploy k6 cloud_pkg/
          chmod +x cloud_pkg/deploy/install-linux.sh
          tar -czf medical-server-cloud-linux-x86_64.tar.gz -C cloud_pkg .

      - name: Upload Cloud Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cloud-linux-x86_64
          path: medical-server-cloud-linux-x86_64.tar.gz

  # 2. Cloud Server Docker Image -> GitHub Container Registry (ghcr.io)
  build-docker-image:
    name: Cloud Docker Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/medical-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Cloud Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Desktop & Full Suite Release Binaries (Linux + Windows)
  build-suite-binaries:
    name: Suite Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri & native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/medical-studio/frontend/package-lock.json

      - name: Build MedicalStudio Frontend
        working-directory: crates/medical-studio/frontend
        run: |
          npm ci
          npm run build

      - name: Build Release Binaries (medical-server & medical-studio)
        run: cargo build --release --bin medical-server --bin medical-studio

      - name: Package Release Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist_pkg
          cp target/release/medical-server dist_pkg/
          cp target/release/medical-studio dist_pkg/
          cp -r migrations config deploy k6 dist_pkg/
          tar -czf medical-suite-${{ matrix.target }}.tar.gz -C dist_pkg .

      - name: Package Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_pkg | Out-Null
          Copy-Item "target/release/medical-server.exe" dist_pkg/
          Copy-Item "target/release/medical-studio.exe" dist_pkg/
          Copy-Item -Recurse migrations, config, deploy, k6 dist_pkg/
          Compress-Archive -Path dist_pkg\* -DestinationPath "medical-suite-${{ matrix.target }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-suite-${{ matrix.target }}
          path: medical-suite-${{ matrix.target }}.${{ matrix.archive }}

  # 4. Publish GitHub Release (auto on push to master/main, v* tag, or manual dispatch)
  publish-release:
    name: Publish GitHub Release
    needs: [build-cloud-server, build-docker-image, build-suite-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Determine release tag & title
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            TITLE="MedicalServer ${TAG}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="MedicalServer ${TAG}"
          else
            TAG="latest"
            SHORT_SHA="${GITHUB_SHA::7}"
            TITLE="MedicalServer Latest (${SHORT_SHA})"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.title }}
          make_latest: true
          generate_release_notes: true
          body: |
            ### 云端服务器部署产物
            - **Linux 云服务器独立部署包**: `medical-server-cloud-linux-x86_64.tar.gz`（内含 `medical-server` Release 二进制、`migrations/`、`config/`、`deploy/docker-compose.yml`、`deploy/medical-server.service`、`deploy/install-linux.sh` 与监控告警配置）
            - **Docker 镜像（GHCR）**: `docker pull ghcr.io/${{ github.repository }}/medical-server:latest`
            - **全套桌面与服务端产物**: `medical-suite-x86_64-unknown-linux-gnu.tar.gz` / `medical-suite-x86_64-pc-windows-msvc.zip`
            - **完整性校验**: `SHA256SUMS.txt`
          files: artifacts/*
