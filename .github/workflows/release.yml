name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri & native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/medical-studio/frontend/package-lock.json

      - name: Build MedicalStudio Frontend
        working-directory: crates/medical-studio/frontend
        run: |
          npm ci
          npm run build

      - name: Build Release Binaries (medical-server & medical-studio)
        run: cargo build --release --target ${{ matrix.target }} --bin medical-server --bin medical-studio

      - name: Package Release Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist_pkg
          cp target/${{ matrix.target }}/release/medical-server dist_pkg/
          cp target/${{ matrix.target }}/release/medical-studio dist_pkg/
          cp -r migrations config deploy k6 dist_pkg/
          tar -czf medical-server-${{ matrix.target }}.tar.gz -C dist_pkg .

      - name: Package Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/medical-server.exe" dist_pkg/
          Copy-Item "target/${{ matrix.target }}/release/medical-studio.exe" dist_pkg/
          Copy-Item -Recurse migrations, config, deploy, k6 dist_pkg/
          Compress-Archive -Path dist_pkg\* -DestinationPath "medical-server-${{ matrix.target }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: medical-server-${{ matrix.target }}.${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: MedicalServer ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: artifacts/*
