[workspace]
resolver = "2"
members = [
    "crates/medical-core",
    "crates/medical-pipeline",
    "crates/medical-server",
    "crates/medical-studio",
    "crates/medical-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AdaSeraph/MedicalServer"
homepage = "https://github.com/AdaSeraph/MedicalServer"
authors = ["AdaSeraph <AdaNierAImer@outlook.com>"]

[workspace.dependencies]
# Internal crates
medical-core = { path = "crates/medical-core" }
medical-pipeline = { path = "crates/medical-pipeline" }

# Async & Core
tokio = { version = "1.54", features = ["full"] }
tokio-stream = "0.1.19"
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "v5", "serde"] }
regex = "1.13.2"
arc-swap = "1.9.5"
dashmap = "6.2.1"
parking_lot = "0.12.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# ECS & NLP
bevy_ecs = { version = "0.15.4", default-features = false }
aho-corasick = "1.1.5"
jieba-rs = "0.11.0"

# Crypto & Auth
aes-gcm = "0.10.3"
sha2 = "0.10.9"
rand = "0.8.8"
hex = "0.4.3"
base64 = "0.22.1"
jsonwebtoken = { version = "12.0", default-features = false, features = ["rust_crypto", "use_pem"] }

# Storage, Cache, Search & HTTP (ALL ring / pure-Rust TLS — NO aws-lc-sys!)
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "json", "chrono", "uuid", "derive", "migrate"] }
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
qdrant-client = { version = "1.20.0", default-features = false, features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Web & Metrics
axum = { version = "0.8.9", features = ["macros", "json"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace", "timeout"] }
prometheus = { version = "0.14.0", default-features = false }

# Pipeline & Indexing
rayon = "1.12.0"
sonic-rs = "0.5.11"
tantivy = "0.27.0"
tantivy-jieba = "0.21.0"
pulldown-cmark = "0.13.6"
docx-rs = "0.4.22"
pdf-extract = "0.12.1"
lopdf = "0.42"
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4.0"
fastembed = "7.7.1"

# Desktop Studio (Tauri 2.x)
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
